<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
  <defs>
    <style>
      .title { font: 700 24px Arial; fill: #1f2937; }
      .label { font: 700 16px Arial; fill: #111827; }
      .field { font: 13px Arial; fill: #374151; }
      .box { fill: #e0f2fe; stroke: #0f172a; stroke-width: 2; rx: 12; }
      .box2 { fill: #dcfce7; stroke: #0f172a; stroke-width: 2; rx: 12; }
      .box3 { fill: #fef3c7; stroke: #0f172a; stroke-width: 2; rx: 12; }
      .line { stroke: #334155; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .small { font: 12px Arial; fill: #475569; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155" />
    </marker>
  </defs>

  <text x="500" y="40" class="title" text-anchor="middle">Student Finance Database ERD</text>

  <rect x="60" y="110" width="220" height="180" class="box"/>
  <text x="170" y="145" class="label" text-anchor="middle">t_student</text>
  <text x="80" y="175" class="field">• student_id (PK)</text>
  <text x="80" y="200" class="field">• first_name</text>
  <text x="80" y="225" class="field">• last_name</text>
  <text x="80" y="250" class="field">• email</text>
  <text x="80" y="275" class="field">• phone_number</text>

  <rect x="440" y="110" width="230" height="200" class="box2"/>
  <text x="555" y="145" class="label" text-anchor="middle">t_bank_accounts</text>
  <text x="460" y="175" class="field">• account_id (PK)</text>
  <text x="460" y="200" class="field">• account_number</text>
  <text x="460" y="225" class="field">• bank_name</text>
  <text x="460" y="250" class="field">• balance</text>
  <text x="460" y="275" class="field">• status</text>
  <text x="460" y="300" class="field">• student_id (FK)</text>

  <rect x="820" y="110" width="220" height="210" class="box3"/>
  <text x="930" y="145" class="label" text-anchor="middle">t_income</text>
  <text x="840" y="175" class="field">• income_id (PK)</text>
  <text x="840" y="200" class="field">• source</text>
  <text x="840" y="225" class="field">• amount</text>
  <text x="840" y="250" class="field">• income_date</text>
  <text x="840" y="275" class="field">• frequency</text>
  <text x="840" y="300" class="field">• student_id (FK)</text>

  <rect x="60" y="420" width="260" height="180" class="box2"/>
  <text x="190" y="455" class="label" text-anchor="middle">t_categories</text>
  <text x="80" y="485" class="field">• category_id (PK)</text>
  <text x="80" y="510" class="field">• category_name</text>
  <text x="80" y="535" class="field">• parent_category_id (FK)</text>

  <rect x="440" y="420" width="290" height="200" class="box"/>
  <text x="585" y="455" class="label" text-anchor="middle">t_transactions</text>
  <text x="460" y="485" class="field">• transaction_id (PK)</text>
  <text x="460" y="510" class="field">• transaction_date</text>
  <text x="460" y="535" class="field">• amount</text>
  <text x="460" y="560" class="field">• transaction_type</text>
  <text x="460" y="585" class="field">• transaction_details</text>
  <text x="460" y="610" class="field">• category_id (FK)</text>
  <text x="460" y="635" class="field">• account_id (FK)</text>

  <rect x="820" y="420" width="290" height="190" class="box3"/>
  <text x="965" y="455" class="label" text-anchor="middle">t_monthly_budget</text>
  <text x="840" y="485" class="field">• budget_id (PK)</text>
  <text x="840" y="510" class="field">• start_date</text>
  <text x="840" y="535" class="field">• end_date</text>
  <text x="840" y="560" class="field">• amount</text>
  <text x="840" y="585" class="field">• student_id (FK)</text>
  <text x="840" y="610" class="field">• category_id (FK)</text>

  <path d="M280,200 L440,200" class="line"/>
  <path d="M170,290 L170,420" class="line"/>
  <path d="M280,510 L440,510" class="line"/>
  <path d="M670,200 L820,200" class="line"/>
  <path d="M585,620 L585,660 L965,660 L965,610" class="line"/>
  <path d="M930,610 L930,660 L585,660" class="line"/>

  <text x="330" y="185" class="small">1 to many</text>
  <text x="205" y="360" class="small">1 to many</text>
  <text x="300" y="500" class="small">1 to many</text>
  <text x="700" y="185" class="small">1 to many</text>
  <text x="670" y="640" class="small">many to one</text>
  <text x="835" y="640" class="small">many to one</text>
</svg>
